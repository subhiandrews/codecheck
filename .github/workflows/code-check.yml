name: code-check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push cancels the review of the previous commit.
concurrency:
  group: code-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: subhiandrews/code-check-action@21dc99b31f9e4ec57ca71aae4e03ebf3acc341be # v1 (v0.1.2)
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # No github-token: the default GITHUB_TOKEN posts as github-actions[bot]
