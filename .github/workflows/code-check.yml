name: code-check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push cancels the review of the previous commit.
concurrency:
  group: code-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: subhiandrews/code-check-action@c7ea220d8033092d50d1ff10306d84dd24d64aac # v1 (v0.1.3)
        with:
          # The code-check release CI reviews with. A bot keeps it current (.github/workflows/code-check-pin.yml).
          code-check-ref: v1.4.5
          # Max subscription token from `claude setup-token`; no API credits needed
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          fail-on-error: true # a failed review shows as a red check, not a silent green one
          # No github-token: the default GITHUB_TOKEN posts as github-actions[bot]
