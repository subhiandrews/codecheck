name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: python -c "import sys; assert sys.version_info >= (3, 14, 10), sys.version"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - name: replay the golden cases
        run: python -m codecheck eval --replay | python -c 'import json,sys; r=json.load(sys.stdin); print(json.dumps(r, indent=2)); sys.exit(0 if r["passed"] else 1)'
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run lint
      - run: node --test tests-node/*.test.js
