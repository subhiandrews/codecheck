name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.14" }
      - run: python -c "import sys; assert sys.version_info >= (3, 14, 10), sys.version"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - name: replay the golden cases
        run: python -m codecheck eval --replay | python -c 'import json,sys; r=json.load(sys.stdin); print(json.dumps(r, indent=2)); sys.exit(0 if r["passed"] else 1)'
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run lint
      - run: node --test tests-node/*.test.js
