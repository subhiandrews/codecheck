[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-check"
version = "0.1.5"
description = "Deterministic PR review and review-comment tooling for Claude Code"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.17"]

[project.scripts]
code-check = "codecheck.cli:main_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["S"]  # bandit rules; src/ is the code that handles untrusted PR input

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/codecheck/runner.py" = ["S603"]  # the one subprocess wrapper; callers pass argv lists, never a shell
